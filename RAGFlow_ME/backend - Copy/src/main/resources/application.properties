server.port=8080

spring.application.name=rag-pdf-chatbot

# H2 file database: data survives application restarts.
spring.datasource.url=jdbc:h2:file:./data/ragdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PDF upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Ollama
ollama.base-url=http://localhost:11434
ollama.chat-model=llama3.2:3b
ollama.embedding-model=nomic-embed-text

# RAG
rag.chunk-size=1200
rag.chunk-overlap=200
rag.top-k=5
rag.min-score=0.15
